name: Build & Release

on:
  workflow_dispatch:        # Déclenchement manuel depuis GitHub
  push:
    tags:
      - 'v*'               # Déclenchement automatique sur un tag ex: v1.2.0

# GITHUB_TOKEN par défaut est en lecture seule sur ce dépôt : sans ce bloc,
# la publication des assets sur la release échoue avec
# "Resource not accessible by integration".
permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installation des dépendances
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build du binaire
        # Utilise le .spec maintenu dans le dépôt (embarque assets/, fixe
        # l'icône) plutôt que des flags dupliqués ici, pour ne jamais
        # diverger du build local.
        run: pyinstaller claudeping_linux.spec --distpath dist

      - name: Upload de l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: claudeping-linux
          path: dist/claudeping
          retention-days: 30

      # Le nom d'asset ("claudeping") est celui référencé par le lien de
      # téléchargement permanent du README (releases/latest/download/...) —
      # ne pas le changer sans mettre à jour le README en conséquence.
      - name: Publier sur la release du tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" "dist/claudeping#claudeping-linux-x86_64" --clobber

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installation des dépendances
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build de l'EXE
        run: pyinstaller claudeping_windows.spec --distpath dist

      - name: Renommer en minuscules
        # Le .spec produit ClaudePing.exe (nom d'affichage Windows) ; l'asset
        # de release garde "claudeping.exe" en minuscules pour matcher le
        # lien de téléchargement permanent du README.
        run: Rename-Item dist\ClaudePing.exe claudeping.exe

      - name: Upload de l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: claudeping-windows
          path: dist/claudeping.exe
          retention-days: 30

      - name: Publier sur la release du tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" "dist/claudeping.exe#claudeping-windows-x86_64.exe" --clobber
