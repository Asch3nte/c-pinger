name: Build Windows EXE

on:
  workflow_dispatch:        # Déclenchement manuel depuis GitHub
  push:
    tags:
      - 'v*'               # Déclenchement automatique sur un tag ex: v1.2.0

# GITHUB_TOKEN par défaut est en lecture seule sur ce dépôt : sans ce bloc,
# l'étape de création/mise à jour de la release échoue avec
# "Resource not accessible by integration".
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installation des dépendances
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build de l'EXE
        # Utilise le .spec maintenu dans le dépôt (pas des flags dupliqués
        # ici) : c'est lui qui embarque assets/ (icône) et fixe l'icône de
        # l'exécutable. Toute divergence entre les deux produirait un build
        # CI sans icône, différent du build local.
        run: pyinstaller claudeping_windows.spec --distpath dist

      - name: Upload de l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: claudeping-windows
          path: dist/ClaudePing.exe
          retention-days: 30

      # Cette étape ne s'exécute que si le workflow a été déclenché par un tag v*
      # Si une release existe déjà pour ce tag (ex: créée manuellement avec
      # ses propres notes), cette action y ajoute juste l'EXE en asset sans
      # toucher au reste — pas de generate_release_notes pour ne pas écraser
      # des notes de release déjà écrites à la main.
      - name: Création de la release GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ClaudePing.exe
