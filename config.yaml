# ============================================================
# ClaudePing - Configuration (multi-comptes)
# Voir config.yaml.example pour la documentation complète et un
# exemple de second compte avec dossier de config isolé.
# ============================================================

accounts:
  - name: "DEFAULT"
    claude_config_dir: ""
    claude_executable: "claude"
    probe:
      interval_minutes: 30
      model: "haiku"
      message: "reply with just: ok"
    ping:
      message: "reply with just: ok"
      model: "haiku"
    fallback:
      enabled: true
      time: "07:00"
      timezone: "Europe/Brussels"
    notifications:
      enabled: true
      on_quota_detected: true
      on_ping_sent: true
      on_error: false

logging:
  level: "INFO"
  file: "claudeping.log"
  max_bytes: 1048576
  backup_count: 3
